<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightscout 碳水上傳</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f5f8;color:#182335;margin:0;padding:24px}.wrap{max-width:480px;margin:35px auto;background:white;padding:26px;border-radius:18px;box-shadow:0 8px 30px #18233512}h1{font-size:24px;margin:0 0 8px}p{color:#526071;line-height:1.6}label{display:block;font-weight:650;margin:18px 0 7px}input,select{box-sizing:border-box;width:100%;font-size:17px;padding:12px;border:1px solid #c9d1dc;border-radius:9px}button{margin-top:24px;background:#1765c1;color:white;border:0;border-radius:10px;width:100%;padding:14px;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;margin-top:16px;font-size:14px}.hint{font-size:13px}.preview{background:#f2f4f7;border-radius:10px;padding:12px;overflow-wrap:anywhere;font-size:13px}code{font-family:ui-monospace,monospace}</style></head><body><main class="wrap"><h1>Nightscout 碳水與胰島素紀錄</h1><p>固定使用 Access Token；胰島素為選填，留空時不會上傳胰島素紀錄。網址可記住，Token 可選擇是否儲存在本機。</p><form id="form"><label for="url">Nightscout 網址</label><input id="url" type="url" placeholder="https://你的網站.onrender.com" required autocomplete="off"><label for="token" id="tokenLabel">Access Token</label><input id="token" type="password" placeholder="具有 Treatment 寫入權限的 Token" required autocomplete="off"><p class="hint" id="authHint">Access Token 會透過 Nightscout 支援的 token 查詢參數傳送。請勿分享含 Token 的完整請求網址。</p><label style="font-weight:500"><input id="rememberToken" type="checkbox" style="width:auto;margin-right:8px">在這台裝置記住 Access Token（未加密）</label><button type="button" id="clearSaved" style="margin-top:8px;background:#667085;font-size:14px;padding:10px">清除已儲存設定</button><p class="hint" id="saveStatus"></p><label for="carbs">碳水化合物（g）</label><input id="carbs" type="number" min="0.1" max="500" step="0.1" placeholder="例如 24" required><label for="insulin">實際施打胰島素（U，選填）</label><input id="insulin" type="number" min="0" max="100" step="0.1" placeholder="未施打請留空"><p class="hint">只有確實已施打且知道劑量時才填寫；留空不會送出 insulin 欄位。</p><label for="notes">備註（選填）</label><input id="notes" type="text" maxlength="120" placeholder="例如：午餐"><p class="hint">送出資料預覽：</p><div id="preview" class="preview"></div><button id="submit" type="submit">確認並上傳 NS</button><div id="status" role="status" aria-live="polite"></div></form><p class="hint">請使用私人裝置，勿將 Token 提供給其他人。正式使用前先確認 Nightscout 的記錄時間與資料是否正確。</p></main><script>
const $=id=>document.getElementById(id);let busy=false;
const storageKey='nightscout-carbs-settings-v1';
function saveSettings(){try{const x={url:$('url').value,rememberToken:$('rememberToken').checked};if(x.rememberToken)x.token=$('token').value;localStorage.setItem(storageKey,JSON.stringify(x));$('saveStatus').textContent=x.rememberToken?'網址與 Token 已儲存在此瀏覽器（未加密）。':'已記住網址；不保存 Token。'}catch(e){$('saveStatus').textContent='此瀏覽器無法保存設定，仍可正常使用上傳。'}}
function restoreSettings(){try{const x=JSON.parse(localStorage.getItem(storageKey)||'{}');if(x.url)$('url').value=x.url;$('rememberToken').checked=!!x.rememberToken;if(x.rememberToken&&x.token)$('token').value=x.token}catch(e){}}
function payload(){const n=Number($('carbs').value);const p={eventType:'Carb Correction',carbs:n};const raw=$('insulin').value.trim();if(raw!=='')p.insulin=Number(raw);const note=$('notes').value.trim();if(note)p.notes=note;return p}
function preview(){const p=payload();$('preview').textContent=JSON.stringify(p,null,2)}
restoreSettings();['url','token'].forEach(id=>$(id).addEventListener('input',saveSettings));$('rememberToken').addEventListener('change',saveSettings);$('clearSaved').addEventListener('click',()=>{try{localStorage.removeItem(storageKey)}catch(e){}$('url').value='';$('token').value='';$('rememberToken').checked=false;$('saveStatus').textContent='設定已清除。';});['carbs','insulin','notes'].forEach(id=>$(id).addEventListener('input',preview));preview();
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const p=payload();if(!Number.isFinite(p.carbs)||p.carbs<=0||p.carbs>500){$('status').textContent='請輸入 0.1 至 500g 的碳水量';return}if(Object.hasOwn(p,'insulin')&&(!Number.isFinite(p.insulin)||p.insulin<0||p.insulin>100)){$('status').textContent='胰島素劑量請輸入 0 至 100U，或留空';return}let url;try{url=new URL($('url').value.trim());if(url.protocol!=='https:')throw Error('網址必須使用 HTTPS');url=url.origin}catch(err){$('status').textContent='Nightscout 網址格式不正確，請使用 HTTPS 網址';return}const token=$('token').value.trim();if(!token){$('status').textContent='請輸入認證資訊';return}if(!confirm(`確定要上傳至 ${url}？\n碳水：${p.carbs}g\n胰島素：${Object.hasOwn(p,'insulin')?p.insulin+'U（請確認已實際施打）':'不記錄'}`))return;busy=true;$('submit').disabled=true;$('status').textContent='上傳中…';try{const headers={'Content-Type':'application/json'};const u=new URL(`${url}/api/v1/treatments`);u.searchParams.set('token',token);const endpoint=u.toString();const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(p),cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok){const message=(await response.text()).slice(0,240);throw Error(`HTTP ${response.status}: ${message}`)}$('status').textContent=`已收到 Nightscout 成功回應：${p.carbs}g 碳水。請至 Nightscout 確認紀錄。`;$('carbs').value='';$('insulin').value='';preview()}catch(err){$('status').textContent=`上傳未確認成功：${err.message}\n請先檢查 Nightscout 是否已有紀錄，再決定是否重試，以免重複上傳。`}finally{busy=false;$('submit').disabled=false}});
</script></body></html>
